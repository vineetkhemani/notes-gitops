# The front door: curl -H 'Host: notes.localhost' http://localhost:8080/
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: notes-api
spec:
  ingressClassName: nginx
  rules:
  - host: notes.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: notes-api
            port:
              number: 80
